; PlatformIO Project Configuration File for Coffee Roaster IoT Simulator
; Hệ thống Giám sát & Truy xuất Mẻ rang Cà phê IoT - TMDT_Ban_Coffee

[env:esp32dev]
platform = espressif32
board = esp32dev
framework = arduino
monitor_speed = 115200
lib_deps =
    adafruit/DHT sensor library @ ^1.4.6
    adafruit/Adafruit Unified Sensor @ ^1.1.14
    marcoschwartz/LiquidCrystal_I2C @ ^1.1.4
    bblanchon/ArduinoJson @ ^7.0.4
